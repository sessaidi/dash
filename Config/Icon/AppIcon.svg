<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Dash's app icon: a dashboard of tiles with Dashii's sparkle. scripts/make-icon.sh renders it. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B6CFF"/>
      <stop offset="0.55" stop-color="#7A4DF2"/>
      <stop offset="1" stop-color="#C042D8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="1" stop-color="#EDE8FF" stop-opacity="0.92"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFE27A"/>
      <stop offset="1" stop-color="#FFB13D"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#2A0E6B" flood-opacity="0.35"/>
    </filter>
    <filter id="outer" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- macOS icon grid: an 824-point squircle centred on the 1024 canvas. -->
  <g filter="url(#outer)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
  </g>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>

  <!-- The dashboard: a wide card on top, a chart card and a list card below. -->
  <g filter="url(#shadow)">
    <rect x="214" y="236" width="596" height="232" rx="56" fill="url(#tile)"/>
    <rect x="214" y="508" width="348" height="280" rx="56" fill="url(#tile)"/>
    <rect x="602" y="508" width="208" height="280" rx="56" fill="url(#tile)"/>
  </g>

  <!-- Wide card: a sparkline. -->
  <polyline points="270,410 352,362 424,392 504,318 584,350 660,290"
            fill="none" stroke="#6A4CF0" stroke-width="30" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="660" cy="290" r="22" fill="#6A4CF0"/>

  <!-- Chart card: bars. -->
  <rect x="268" y="642" width="56" height="94" rx="18" fill="#8E7BFF"/>
  <rect x="360" y="590" width="56" height="146" rx="18" fill="#6A4CF0"/>
  <rect x="452" y="618" width="56" height="118" rx="18" fill="#B05CE6"/>

  <!-- List card: rows. -->
  <rect x="644" y="566" width="124" height="28" rx="14" fill="#6A4CF0"/>
  <rect x="644" y="634" width="96" height="28" rx="14" fill="#B9AEFF"/>
  <rect x="644" y="702" width="112" height="28" rx="14" fill="#B9AEFF"/>

  <!-- Dashii's sparkle on the top-right corner of the wide card. -->
  <g filter="url(#shadow)" transform="translate(782 232)">
    <path d="M0,-118 C14,-38 38,-14 118,0 C38,14 14,38 0,118 C-14,38 -38,14 -118,0 C-38,-14 -14,-38 0,-118 Z" fill="url(#spark)"/>
  </g>
</svg>
